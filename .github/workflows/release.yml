name: official-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to publish (for example v0.1.1)
        required: true
        type: string
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$TAG_NAME"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$'; then
            echo "version must look like v0.1.1" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
      - name: Lowercase GHCR image
        run: |
          image="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_REPO=${image}" >> "$GITHUB_ENV"
          echo "VERSION_TAG=${image}:${VERSION}" >> "$GITHUB_ENV"
          echo "EPOCH_TAG=${image}:epoch-1" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: pip install -e ".[dev]"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - name: CI
        run: IMAGE="${VERSION_TAG}" N4X_IMAGE_REPO="${IMAGE_REPO}" sh scripts/ci.sh
      - name: Write release index
        run: |
          python scripts/write_release_manifest.py \
            --version "${VERSION}" \
            --artifact-url "${VERSION_TAG}" \
            --output dist/release-index.json
      - name: Push image
        run: |
          docker tag "${VERSION_TAG}" "${EPOCH_TAG}"
          docker push "${VERSION_TAG}"
          docker push "${EPOCH_TAG}"
      - name: Create git tag
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "tag already exists"
          else
            git tag -a "${VERSION}" -m "Official release ${VERSION}"
            git push origin "${VERSION}"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: dist/release-index.json
          generate_release_notes: true
